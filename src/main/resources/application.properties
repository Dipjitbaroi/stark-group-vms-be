spring.application.name=stark-group-vms-backend

# Server Configuration
server.port=${SERVER_PORT:8080}

# Database Configuration (MySQL / TiDB compatible)
# Injected automatically from the single connection string (DB_STRING) in .env
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/vms_db?sslMode=PREFERRED&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Admin Auth Credentials (Loaded dynamically from .env)
vms.auth.admin.username=${VMS_ADMIN_USERNAME}
vms.auth.admin.password=${VMS_ADMIN_PASSWORD}
vms.auth.admin.fullName=${VMS_ADMIN_FULL_NAME:Fleet Manager}
vms.auth.admin.role=${VMS_ADMIN_ROLE:FLEET_ADMIN}

# CORS Configuration (Loaded dynamically from .env)
vms.cors.allowed-origins=${VMS_CORS_ORIGINS:*}

# Fleet Data Seeding
vms.seed.enabled=${VMS_SEED_ENABLED:true}
