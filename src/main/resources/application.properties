spring.application.name=stark-group-vms-backend

# Server Configuration (Loaded strictly from .env or PORT)
server.port=${PORT:${SERVER_PORT:8080}}

# Database Configuration (Injected strictly from DB_STRING in .env, falls back to localhost if not set)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/vms_db?sslMode=PREFERRED&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Admin Auth Credentials (Loaded strictly from .env)
vms.auth.admin.username=${VMS_ADMIN_USERNAME}
vms.auth.admin.password=${VMS_ADMIN_PASSWORD}
vms.auth.admin.fullName=${VMS_ADMIN_FULL_NAME}
vms.auth.admin.role=${VMS_ADMIN_ROLE}

# CORS Configuration (Loaded strictly from .env)
vms.cors.allowed-origins=${VMS_CORS_ORIGINS}

# JWT Configuration (Loaded strictly from .env)
vms.jwt.secret=${VMS_JWT_SECRET}
vms.jwt.expiration-ms=${VMS_JWT_EXPIRATION_MS}

# Fleet Data Seeding (Loaded strictly from .env)
vms.seed.enabled=${VMS_SEED_ENABLED}
