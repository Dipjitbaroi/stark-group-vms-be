spring.application.name=stark-group-vms-backend-test
server.port=0

# In-memory H2 database for isolated tests
spring.datasource.url=jdbc:h2:mem:vmstest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Dynamically loaded strictly from .env
vms.auth.admin.username=${VMS_ADMIN_USERNAME}
vms.auth.admin.password=${VMS_ADMIN_PASSWORD}
vms.auth.admin.fullName=${VMS_ADMIN_FULL_NAME}
vms.auth.admin.role=${VMS_ADMIN_ROLE}

vms.cors.allowed-origins=${VMS_CORS_ORIGINS}

vms.jwt.secret=${VMS_JWT_SECRET}
vms.jwt.expiration-ms=${VMS_JWT_EXPIRATION_MS}

vms.seed.enabled=${VMS_SEED_ENABLED}
