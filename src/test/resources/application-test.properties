spring.application.name=stark-group-vms-backend-test

# In-memory H2 database for isolated tests
spring.datasource.url=jdbc:h2:mem:vmstest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

vms.auth.admin.username=test-admin
vms.auth.admin.password=test-secret-123!
vms.auth.admin.fullName=Test Administrator
vms.auth.admin.role=TEST_ADMIN

vms.cors.allowed-origins=*
